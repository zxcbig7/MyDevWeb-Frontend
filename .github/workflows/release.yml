# 觸發時機：push tag（格式 V.*，例如 V.1.0.0.0.0）
# 目的：建置 Docker image → 推到 Harbor → 更新 Deployment-Apps 的 image tag → ArgoCD 自動 sync
name: Frontend Release

on:
  push:
    tags: ['V.*.*.*']

env:
  IMAGE: harbor.viclai.idv.tw/mydevweb/frontend
  DOCKER_BUILDKIT: 0

jobs:
  release:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Use Git Bash (not WSL bash)
        shell: powershell
        run: |
          $gitBin = "C:\Program Files\Git\bin"
          $gitUsr = "C:\Program Files\Git\usr\bin"
          "$gitBin`n$gitUsr" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PATH=$gitBin;$gitUsr;$($env:PATH)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 建置前端（不用於部署，只確認 build 正常）
      - name: Build
        run: npm run build

      # 修正 Docker Desktop daemon namespace 的 DNS（避免解析到 Cloudflare Tunnel 內部 IPv6）
      - name: Fix Docker DNS for Harbor
        shell: powershell
        run: |
          wsl -d docker-desktop -- nsenter --target 172 --mount --uts -- sh -c "grep -q 'harbor.viclai.idv.tw' /etc/hosts || echo '104.21.80.46 harbor.viclai.idv.tw' >> /etc/hosts"

      # 建置 Docker image 並推到 Harbor，tag 為 git tag 名稱
      # VITE_* 是前端環境變數，build 時 bake 進 image
      - name: Build & push image
        env:
          DOCKER_BUILDKIT: 0
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
        run: |
          echo "$HARBOR_PASSWORD" | docker login ${{ secrets.HARBOR_URL }} \
            -u "$HARBOR_USERNAME" --password-stdin
          docker build \
            --build-arg VITE_API_BASE=${{ secrets.VITE_API_BASE }} \
            --build-arg VITE_AUTH_BASE=${{ secrets.VITE_AUTH_BASE }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} \
            --build-arg VITE_APP_ENV=PROD \
            --build-arg VITE_SHOW_PRIVATE=false \
            -t ${{ env.IMAGE }}:${{ github.ref_name }} .
          docker push ${{ env.IMAGE }}:${{ github.ref_name }}

      # 更新 Deployment-Apps repo 的 image tag
      # ArgoCD 偵測到變更後自動部署新版本
      - name: Update deployment repo
        env:
          TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          git clone https://zxcbig7:$TOKEN@github.com/zxcbig7/Deployment-Apps.git deploy
          cd deploy
          TAG="${{ github.ref_name }}"
          sed -i "s|tag: .*|tag: \"$TAG\"|" mydevweb-fe/PROD/values.yaml
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git commit -am "ci: update frontend image to $TAG"
          git push
