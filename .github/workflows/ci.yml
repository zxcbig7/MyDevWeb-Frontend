# 觸發時機：push 到 main branch
# 目的：驗證程式碼品質，不建置 image
name: Frontend CI

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 檢查程式碼風格
      - name: Lint
        run: npm run lint

      # 確認能成功建置（不產出 image）
      - name: Build
        run: npm run build
