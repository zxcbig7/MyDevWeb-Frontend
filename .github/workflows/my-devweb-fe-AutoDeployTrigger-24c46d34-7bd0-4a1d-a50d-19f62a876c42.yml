name: Trigger auto deployment for my-devweb-fe

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ dev ]
    paths:
    - '**'
    - '.github/workflows/my-devweb-fe-AutoDeployTrigger-24c46d34-7bd0-4a1d-a50d-19f62a876c42.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MYDEVWEBFE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MYDEVWEBFE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MYDEVWEBFE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: mydevwebcontainerregistry.azurecr.io
          registryUsername: ${{ secrets.MYDEVWEBFE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MYDEVWEBFE_REGISTRY_PASSWORD }}
          containerAppName: my-devweb-fe
          resourceGroup: MyPersonalWebsite
          imageToBuild: mydevwebcontainerregistry.azurecr.io/my-devweb-fe:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


